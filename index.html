<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie - Monitor Paneel</title>
    <style>
        :root {
            --police-blue: #1c2b4a;
            --police-gold: #c5a059;
            --bg-gray: #f4f4f4;
            --alert-red: #cc0000;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            color: var(--police-blue);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background: var(--police-blue);
            color: white;
            width: 100%;
            padding: 1rem;
            text-align: center;
            border-bottom: 4px solid var(--police-gold);
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin-top: 2rem;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .hidden { display: none; }

        button, select, input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button { background: var(--police-blue); color: white; cursor: pointer; border: none; font-weight: bold; }
        .btn-gold { background: var(--police-gold); }
        .btn-reset { background: var(--alert-red); margin-top: 20px; }

        .sentence-box {
            background: #eef2f7;
            padding: 1.5rem;
            border-left: 5px solid var(--police-gold);
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        /* --- SPEELSE FEEDBACK MUUR --- */
        #peer-feedback-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        .feedback-card {
            background: #fffef0;
            padding: 15px;
            border-radius: 2px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
            transition: transform 0.2s, opacity 0.3s;
            border-top: 2px solid rgba(0,0,0,0.05);
        }

        .feedback-card:nth-child(even) { transform: rotate(1.5deg); background: #f0faff; }
        .feedback-card:nth-child(3n) { transform: rotate(-0.5deg); background: #fdf0ff; }

        .feedback-card b { display: block; margin-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; }

        .tip-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tip-btn {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
            margin: 0;
        }

        .tip-btn:hover { background: var(--police-gold); color: white; }

        /* Monitor Styling voor docent */
        .class-section { margin-top: 20px; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; }
        .class-header { background: #eee; padding: 10px; font-weight: bold; border-bottom: 1px solid #ddd; text-transform: uppercase; }
        .answer-row { padding: 10px; border-bottom: 1px solid #eee; display: grid; grid-template-columns: 120px 1fr 150px; font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <h1>Opleiding GGP - Taaldrempel Monitor</h1>
</header>

<div class="container">
    <div id="login-screen">
        <h3>Aanmelden Student</h3>
        <input type="text" id="username" placeholder="Voornaam">
        <select id="class-select">
            <option value="delta">Delta</option>
            <option value="echo">Echo</option>
            <option value="foxtrot">Foxtrot</option>
            <option value="golf">Golf</option>
            <option value="hotel">Hotel</option>
            <option value="juliett">Juliett</option>
            <option value="lima">Lima</option>
            <option value="mike">Mike</option>
        </select>
        <button id="btn-login">Start Training</button>
        <hr>
        <button id="btn-teacher-mode" style="background:none; color: gray; font-size: 0.8rem;">Open Docenten Monitor</button>
    </div>

    <div id="lesson-screen" class="hidden">
        <div id="progress">Scherm <span id="current-num">1</span></div>
        <div class="sentence-box" id="wrong-sentence">Laden...</div>
        <textarea id="correction-input" placeholder="Verbeter de bovenstaande zin..." rows="3"></textarea>
        <button id="btn-submit">Verzend Correctie</button>
        <h4>Tips van collega's</h4>
        <div id="peer-feedback-list"></div>
    </div>

    <div id="teacher-controls" class="hidden">
        <h3>Docentenpaneel & Live Monitor</h3>
        <div class="sentence-box">
            Huidige zin (<span id="admin-step-label">1</span>): <br>
            <span id="admin-sentence-text" style="font-style: italic;"></span>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button id="btn-prev">Vorige Scherm</button>
            <button id="btn-next" class="btn-gold">Volgende Scherm</button>
        </div>

        <h4>Live Resultaten:</h4>
        <div id="class-monitor"></div>

        <button id="btn-reset" class="btn-reset">RESET SESSIE & WISSEN</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, runTransaction, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC-Of0AUOd-kVo2RKxYc-68Gr-RO4HdRk0",
        authDomain: "q2aangifteles2.firebaseapp.com",
        databaseURL: "https://q2aangifteles2-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "q2aangifteles2",
        storageBucket: "q2aangifteles2.firebasestorage.app",
        messagingSenderId: "696806554615",
        appId: "1:696806554615:web:bd877b1caee23c5283ccf2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- GEUPDATE ZINNEN: VTT, POLITIE THEMA, GEEN IK-VORM ---
  const zinnen = [
        "De verdachte is door de collega's met gepast geweld onder controle gebracht.",
        "Het voertuig is door de surveillance-eenheid aan de kant gezet voor een controle.",
        "De identiteit van de betrokkenen is ter plaatse vastgesteld.",
        "Er is door de verbalisanten een onderzoek ingesteld in de kofferbak van de auto.",
        "De verdovende middelen zijn door de hondengeleider in de woning aangetroffen.",
        "De getuige is door de politie gehoord over de toedracht van het incident.",
        "Het gebied is door de agenten afgezet met lint om de sporen te beschermen.",
        "De gestolen goederen zijn door de opsporingsambtenaar in beslag genomen.",
        "Er is door de eenheid een achtervolging ingezet op de vluchtende motorrijder.",
        "De gevaarlijke situatie is door het snelle optreden van de politie beëindigd.",
        "De verdachte is na een korte achtervolging te voet aangehouden op verdenking van diefstal.",
        "Er is bij de aanhouding fysiek geweld toegepast om de verzetplegende verdachte te boeien.",
        "Het voertuig is door een erkend bergingsbedrijf weggesleept wegens het blokkeren van een nooduitgang.",
        "De verdachte is direct na de aanhouding overgebracht naar het cellencomplex voor verhoor.",
        "Er is gebruikgemaakt van de uitschuifbare wapenstok om de verdachte tot medewerking te dwingen.",
        "De auto is door de politie in beslag genomen en weggesleept voor technisch sporenonderzoek.",
        "De aanhouding is op een veilige wijze verricht door de inzet van meerdere eenheden.",
        "Er zijn pepperspray en fysieke dwangmiddelen ingezet om de dreigende situatie te deëscaleren.",
        "Het achtergelaten voertuig is na overleg met de officier van justitie weggesleept van de rijksweg.",
        "De verdachte is conform de procedure gewezen op de rechten en de reden van de aanhouding."
    ];
    let currentUser = "";
    let currentClass = "";
    const klassen = ["delta", "echo", "foxtrot", "golf", "hotel", "juliett", "lima", "mike"];

    // --- NAVIGATIE ---
    document.getElementById('btn-login').onclick = () => {
        currentUser = document.getElementById('username').value.trim();
        currentClass = document.getElementById('class-select').value;
        if(!currentUser) return alert("Naam invullen.");
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('lesson-screen').classList.remove('hidden');
        initSync(false);
    };

    document.getElementById('btn-teacher-mode').onclick = () => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('teacher-controls').classList.remove('hidden');
        initSync(true);
    };

    // --- SYNC LOGICA ---
    function initSync(isMonitor) {
        onValue(ref(db, 'session/currentStep'), (snapshot) => {
            const step = snapshot.val() || 0;
            document.getElementById('current-num').innerText = step + 1;
            document.getElementById('wrong-sentence').innerText = zinnen[step];
            
            if(isMonitor) {
                document.getElementById('admin-step-label').innerText = step + 1;
                document.getElementById('admin-sentence-text').innerText = zinnen[step];
                monitorAllClasses(step);
            } else {
                loadStudentFeedback(step);
            }
        });
    }

    // --- DOCENT FUNCTIES ---
    document.getElementById('btn-next').onclick = () => changeStep(1);
    document.getElementById('btn-prev').onclick = () => changeStep(-1);
    document.getElementById('btn-reset').onclick = async () => {
        if(confirm("Sessie resetten? Alle data wordt gewist.")) {
            await set(ref(db, 'session/currentStep'), 0);
            await remove(ref(db, 'corrections'));
        }
    };

    function changeStep(delta) {
        runTransaction(ref(db, 'session/currentStep'), (c) => {
            let next = (c || 0) + delta;
            return Math.max(0, Math.min(next, zinnen.length - 1));
        });
    }

    function monitorAllClasses(step) {
        onValue(ref(db, `corrections/${step}`), (snapshot) => {
            const monitorDiv = document.getElementById('class-monitor');
            monitorDiv.innerHTML = "";
            const allData = snapshot.val() || {};

            klassen.forEach(klas => {
                let html = `<div class="class-section"><div class="class-header">Klas: ${klas}</div>`;
                if(allData[klas]) {
                    for(let user in allData[klas]) {
                        const entry = allData[klas][user];
                        html += `<div class="answer-row">
                            <strong>${user}</strong>
                            <span>${entry.text}</span>
                            <span style="font-size: 0.7rem; color: #666;">💡H:${entry.tip_helder||0} | ⚖️O:${entry.tip_obj||0} | ✍️T:${entry.tip_taal||0}</span>
                        </div>`;
                    }
                } else {
                    html += `<div style="padding:10px; color:#999; font-style:italic;">Geen inzendingen...</div>`;
                }
                html += `</div>`;
                monitorDiv.innerHTML += html;
            });
        });
    }

    // --- STUDENT FEEDBACK (STABIEL) ---
    document.getElementById('btn-submit').onclick = () => {
        const text = document.getElementById('correction-input').value.trim();
        if(!text) return;
        onValue(ref(db, 'session/currentStep'), (s) => {
            set(ref(db, `corrections/${s.val() || 0}/${currentClass}/${currentUser}`), { 
                text, tip_helder: 0, tip_obj: 0, tip_taal: 0 
            });
            alert("Correctie verzonden!");
            document.getElementById('correction-input').value = "";
        }, { onlyOnce: true });
    };

    function loadStudentFeedback(step) {
        const list = document.getElementById('peer-feedback-list');
        onValue(ref(db, `corrections/${step}/${currentClass}`), (snap) => {
            const data = snap.val() || {};
            for(let user in data) {
                if(user === currentUser) continue;
                const entry = data[user];
                
                let card = document.getElementById(`card-${user}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${user}`;
                    card.className = 'feedback-card';
                    list.appendChild(card);
                }

                card.innerHTML = `
                    <b>${user}</b>
                    <p style="font-size:0.9rem; margin:0;">"${entry.text}"</p>
                    <div class="tip-container">
                        <button class="tip-btn" onclick="window.giveTip('${step}','${user}','tip_helder')">💡 Tip: Maak helderder (${entry.tip_helder || 0})</button>
                        <button class="tip-btn" onclick="window.giveTip('${step}','${user}','tip_obj')">⚖️ Tip: Meer objectief (${entry.tip_obj || 0})</button>
                        <button class="tip-btn" onclick="window.giveTip('${step}','${user}','tip_taal')">✍️ Tip: Spelling/Taal (${entry.tip_taal || 0})</button>
                    </div>
                `;
            }
        });
    }

    window.giveTip = (step, target, type) => {
        runTransaction(ref(db, `corrections/${step}/${currentClass}/${target}/${type}`), (c) => (c || 0) + 1);
    };
</script>
</body>
</html>
